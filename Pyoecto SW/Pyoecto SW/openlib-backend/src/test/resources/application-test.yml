spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

openlib:
  jwt:
    secret: "testSecretKey1234567890abcdefghijklmnopqrstuvwxyz1234"
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  signed-url:
    secret: "testSignedUrlSecret1234567890abcdefghijklmnopqrstuvwxyz"
    expiration-minutes: 5
  storage:
    base-path: "./test-storage"
