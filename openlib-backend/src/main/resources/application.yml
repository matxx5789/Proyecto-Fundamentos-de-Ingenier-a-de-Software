spring:
  application:
    name: openlib-backend

  # ── PostgreSQL con Docker ──
  datasource:
    url: jdbc:postgresql://localhost:5432/openlib_db
    driver-class-name: org.postgresql.Driver
    username: openlib_user
    password: openlib_pass

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Caché en memoria (reemplaza Redis) ──
  cache:
    type: simple
  mail:
    host: smtp.example.com
    port: 587
    username: your-smtp-user@example.com
    password: your-smtp-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ── Servidor ──
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# ── JWT ──
openlib:
  jwt:
    secret: "3d6f1a9b8e2c4f7d0a5b3e8c1d4f7a2b9e6c3d0f7a4b1e8c5d2f9a6b3e0c7d4"
    access-token-expiration: 900000      # 15 minutos en ms
    refresh-token-expiration: 604800000  # 7 días en ms
  signed-url:
    secret: "7f4a2b9e6c3d0f1a8b5e2c9d4f7a1b3e6c0d7f4a2b9e6c3d0f1a8b5e2c9d4f7a"
    expiration-minutes: 5
  storage:
    base-path: "./storage/books"

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── OpenAPI / Swagger ──
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: "OpenLib Market API"
    version: "1.0.0-MVP"
    description: "Sistema de Gestión de Activos Digitales Académicos"

# ── Logging ──
logging:
  level:
    com.openlib: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
